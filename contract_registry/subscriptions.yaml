subscriptions:
  - contract_id: week3-document-refinery-extractions
    subscriber_id: week4-cartographer
    fields_consumed:
      - doc_id
      - extracted_facts
      - extraction_model
    breaking_fields:
      - field: extracted_facts.confidence
        reason: used for node ranking; a 0.0-1.0 to 0-100 scale change breaks ordering and downstream trust scores
      - field: doc_id
        reason: primary key used as the lineage node identity
    validation_mode: AUDIT
    registered_at: '2026-04-02T09:00:00Z'
    contact: week4-team@org.com

  - contract_id: week4-brownfield-cartographer-lineage
    subscriber_id: week6-enforcer
    fields_consumed:
      - nodes
      - edges
      - captured_at
    breaking_fields:
      - field: edges
        reason: transitive blast-radius traversal depends on relationship edges being present and typed correctly
      - field: nodes
        reason: producer and consumer node identity resolution fails if node ids or metadata disappear
    validation_mode: AUDIT
    registered_at: '2026-04-02T09:00:00Z'
    contact: week6-team@org.com

  - contract_id: week5-event-records
    subscriber_id: week6-enforcer
    fields_consumed:
      - event_type
      - aggregate_id
      - recorded_at
      - payload
    breaking_fields:
      - field: recorded_at
        reason: timestamp parsing gates event replay ordering and enforcement windows
      - field: schema_version
        reason: incompatible schema versions change how event payloads are interpreted
      - field: payload_keys
        reason: missing canonical payload keys prevent downstream health and policy checks
    validation_mode: ENFORCE
    registered_at: '2026-04-02T09:00:00Z'
    contact: week6-team@org.com

  - contract_id: langsmith-agent-traces
    subscriber_id: week6-enforcer
    fields_consumed:
      - run_id
      - outputs
      - end_time
    breaking_fields:
      - field: outputs
        reason: trace-to-contract correlation and audit summaries require model outputs to remain machine-readable
      - field: end_time
        reason: latency and drift windows depend on complete trace timing
    validation_mode: AUDIT
    registered_at: '2026-04-02T09:00:00Z'
    contact: observability-team@org.com
