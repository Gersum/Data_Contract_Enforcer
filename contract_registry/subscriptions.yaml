subscriptions:
  - contract_id: week3-document-refinery-extractions
    subscriber_id: week4-cartographer
    fields_consumed:
      - doc_id
      - extracted_facts
      - extraction_model
    breaking_fields:
      - field: extracted_facts.confidence
        reason: used for node ranking; a 0.0-1.0 to 0-100 scale change breaks ordering and downstream trust scores
      - field: doc_id
        reason: primary key used as the lineage node identity
    validation_mode: AUDIT
    registered_at: '2026-04-02T09:00:00Z'
    contact: week4-team@org.com

  - contract_id: week3-document-refinery-extractions
    subscriber_id: week5-event-platform
    fields_consumed:
      - doc_id
      - extracted_facts.confidence
      - extracted_facts.entity_refs
      - entities.type
    breaking_fields:
      - field: extracted_facts.confidence
        reason: extraction-derived events and downstream policy scores assume normalized confidence values
      - field: extracted_facts.entity_refs
        reason: broken entity references produce invalid event payload relationships
      - field: entities.type
        reason: event routing and fact labeling depend on stable entity categories
    validation_mode: ENFORCE
    registered_at: '2026-04-02T09:00:00Z'
    contact: week5-team@org.com

  - contract_id: week4-brownfield-cartographer-lineage
    subscriber_id: week7-evaluator
    fields_consumed:
      - nodes
      - edges
      - captured_at
    breaking_fields:
      - field: edges
        reason: transitive blast-radius traversal depends on relationship edges being present and typed correctly
      - field: nodes
        reason: producer and consumer node identity resolution fails if node ids or metadata disappear
    validation_mode: AUDIT
    registered_at: '2026-04-02T09:00:00Z'
    contact: week7-team@org.com

  - contract_id: week2-verdict-records
    subscriber_id: week7-ai-extensions
    fields_consumed:
      - overall_verdict
      - confidence
      - overall_score
    breaking_fields:
      - field: overall_verdict
        reason: output schema violation rate tracking depends on stable verdict enums
      - field: confidence
        reason: AI trust summaries and scoring depend on numeric confidence semantics
    validation_mode: AUDIT
    registered_at: '2026-04-02T09:00:00Z'
    contact: ai-quality@org.com

  - contract_id: week5-event-records
    subscriber_id: week7-evaluator
    fields_consumed:
      - event_type
      - aggregate_id
      - recorded_at
      - payload
    breaking_fields:
      - field: recorded_at
        reason: timestamp parsing gates event replay ordering and enforcement windows
      - field: schema_version
        reason: incompatible schema versions change how event payloads are interpreted
      - field: payload_keys
        reason: missing canonical payload keys prevent downstream health and policy checks
    validation_mode: ENFORCE
    registered_at: '2026-04-02T09:00:00Z'
    contact: week7-team@org.com

  - contract_id: week1-intent-records
    subscriber_id: week2-intermediate
    fields_consumed:
      - intent_id
      - code_refs
      - repository
    breaking_fields:
      - field: code_refs
        reason: verdict generation depends on stable file-reference arrays from the research stage
      - field: repository
        reason: code-reference lookups break if repository identity is removed or renamed
    validation_mode: AUDIT
    registered_at: '2026-04-02T09:00:00Z'
    contact: week2-team@org.com

  - contract_id: langsmith-agent-traces
    subscriber_id: week7-evaluator
    fields_consumed:
      - run_id
      - outputs
      - end_time
    breaking_fields:
      - field: outputs
        reason: trace-to-contract correlation and audit summaries require model outputs to remain machine-readable
      - field: end_time
        reason: latency and drift windows depend on complete trace timing
    validation_mode: AUDIT
    registered_at: '2026-04-02T09:00:00Z'
    contact: observability-team@org.com
